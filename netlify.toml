# Netlify configuration (SPEC.md §13.1).

[build]
  # verify = astro check + tests + contrast + build + html-validate + link check + SEO check (SPEC.md §13.5).
  # A broken content entry or wrong data stops the deploy instead of going live.
  command = "npm run verify"
  publish = "dist"
  # Skip builds for commits that only touch docs or tooling (saves credits, see scripts/netlify-ignore.sh).
  ignore = "bash scripts/netlify-ignore.sh"

# Node version comes from .nvmrc (24).

# URLs of the old club site (fbkloka.si until the switch), so old links and search results keep working.
# /kontakt/ and /novice/ keep their paths. Pages with the same path win over these rules.
# Netlify ignores the trailing slash here, so /o-klubu matches too.
[[redirects]]
  from = "/o-klubu/"
  to = "/klub/"
  status = 301

# Old public team page. Only this exact path: /ekipa/* is used for the hidden plato and prevoz pages (SPEC.md §19).
[[redirects]]
  from = "/ekipa/"
  to = "/ekipe/"
  status = 301

# /tekmovanja/ and /tekmovanja/arhiv/
[[redirects]]
  from = "/tekmovanja/*"
  to = "/tekme/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    # Without includeSubDomains until every subdomain of fbkloka.si is known to serve HTTPS:
    # includeSubDomains would lock a subdomain without HTTPS out for a year. TODO: check DNS.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Enforced since 28. 9. 2026 (SPEC.md §15, step 8): no violations with the enforced policy in
    # tests/e2e/site.spec.ts, and on the live site only the injected "Powered by Netlify" badge
    # (turned off in Project configuration > General) broke it. frame-ancestors replaces X-Frame-Options.
    # Stricter than SPEC.md §13.1: the build has no inline styles, no data: images and no inline
    # scripts, and opponent logos are local, so none of those sources are needed.
    # connect-src also allows the Apps Script web app of /ekipa/plato and /ekipa/prevoz (SPEC.md §19): script.google.com
    # answers with a redirect to script.googleusercontent.com. It is in the site-wide policy on purpose: Netlify does not
    # document which value wins when two [[headers]] rules set the same header, and two CSP headers would both apply
    # (the stricter one blocking). The risk is small: script-src stays 'self', so only our own scripts can call out.
    Content-Security-Policy = "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"

# Files in /_astro/ have a content hash in their name, so browsers may keep them for a year.
# Fewer requests and less bandwidth, which also saves credits.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Team match calendars (/koledar/[slug].ics).
[[headers]]
  for = "/koledar/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

# /admin (Decap, phase 2) needs its own CSP in a separate [[headers]] block. Never loosen "/*".
