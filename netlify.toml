# Netlify configuration (SPEC.md §13.1).

[build]
  # verify = astro check + tests + contrast + build + html-validate + link check + SEO check (SPEC.md §13.5).
  # A broken content entry or wrong data stops the deploy instead of going live.
  command = "npm run verify"
  publish = "dist"
  # Skip builds for commits that only touch docs or tooling (saves credits, see scripts/netlify-ignore.sh).
  ignore = "bash scripts/netlify-ignore.sh"

# Node version comes from .nvmrc (24).

# URLs of the old club site (fbkloka.si until the switch), so old links and search results keep working.
# /kontakt/ and /novice/ keep their paths. Pages with the same path win over these rules.
# Netlify ignores the trailing slash here, so /o-klubu matches too.
[[redirects]]
  from = "/o-klubu/"
  to = "/klub/"
  status = 301

# Old public team page. Only this exact path: /ekipa/* is used for the hidden plato and prevoz pages (SPEC.md §19).
[[redirects]]
  from = "/ekipa/"
  to = "/ekipe/"
  status = 301

# /tekmovanja/ and /tekmovanja/arhiv/
[[redirects]]
  from = "/tekmovanja/*"
  to = "/tekme/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    # Without includeSubDomains until every subdomain of fbkloka.si is known to serve HTTPS:
    # includeSubDomains would lock a subdomain without HTTPS out for a year. TODO: check DNS.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP in two parts (30. 9. 2026). Netlify combines every rule that matches a path (it has no "except"), and two
    # CSP headers both apply, the stricter one blocking. A strict policy here would also cover /admin, where Decap needs
    # 'unsafe-eval' and inline styles. So this header keeps only what every path can live with, frame-ancestors
    # included (a <meta> cannot set it; it replaces X-Frame-Options). The strict site policy is a <meta> tag in every
    # built page (src/config/csp.ts, src/layouts/Base.astro, checked by scripts/check-seo.mjs), /admin has its own rule.
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Files in /_astro/ have a content hash in their name, so browsers may keep them for a year.
# Fewer requests and less bandwidth, which also saves credits.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Team match calendars (/koledar/[slug].ics).
[[headers]]
  for = "/koledar/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

# Decap CMS (SPEC.md §13.4). Its own CSP, on top of the "/*" one: Decap needs 'unsafe-eval' and inline styles, loads
# from unpkg (pinned version with an SRI hash in public/admin/index.html), talks to the GitHub API and shows images
# from the repository. No page of the site loads anything from /admin.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com; form-action 'self'"
    Cache-Control = "no-cache"
