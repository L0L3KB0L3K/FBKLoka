# Fetches FloorballFlash matches and commits src/data/ff only when the data changed (SPEC.md §5.6).
# The commit triggers a Netlify build; no change means no commit and no build.
# The Sunday run also writes the weekly summary into src/content/novice (SPEC.md §20.5), in the same commit.
# Club edits from Decap are saved on the branch "vsebina" (SPEC.md §13.4). The Sunday run and a manual run merge it into
# main first, so edits, results and the summary go out in one push and one deploy; then "vsebina" is brought up to
# date. A manual run is the way to publish an edit at once (15 credits). On a merge conflict the edits wait (warning).
#
# Only Sunday (decision 26. 10. 2026): Sunday covers both matches of the weekend, a Saturday run would cost about 60
# credits a month (SPEC.md §20.6). To turn Saturday back on, restore its cron line below; scripts/ff-gate.ts still has
# the Saturday window.
#
# Schedule (SPEC.md §20.2): Saturday 22:30 and Sunday 22:00, Ljubljana time. Saturday brings the day's results if they
# are already entered in FloorballFlash; Sunday covers the whole weekend. Each production deploy costs 15 of the 300
# monthly credits on Netlify Free, so data only changes (and deploys) at these times.
# GitHub starts scheduled runs late or drops them: on 4., 11. and 18. 10. 2026 the only Sunday run started 2 to 3.5
# hours late and the old 45-minute window skipped it, so three weekends were never published. So: several cron entries
# per night (UTC, no summer time), and scripts/ff-gate.ts lets through every run from Sunday 22:00 to Monday 06:00
# Ljubljana, until the bot has published data in that window (one deploy a night). Tested in tests/ff-gate.test.ts.
# For a change during the week (a moved match): GitHub > Actions > fetch-floorballflash > Run workflow (always runs,
# never writes a summary). A missed summary by hand: WEEK_END=2026-09-27 npm run week:publish, commit, push.
#
# GitHub turns off scheduled workflows in public repos after 60 days without commits (e.g. in summer):
# re-enable it under Actions before the season starts.
name: fetch-floorballflash

on:
  schedule:
    # - cron: "37 20,21 * * 6" # Saturday 22:37 Ljubljana: 20:37 UTC in summer time, 21:37 UTC in winter time
    - cron: "7 20,21,22,23 * * 0" # Sunday 22:07-01:07 Ljubljana in summer, 21:07-00:07 in winter (21:07 is skipped)
    - cron: "7 0,1,2,3 * * 1" # Monday 02:07-05:07 in summer, 01:07-04:07 in winter: retries when GitHub drops a run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-floorballflash
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: merging the branch vsebina needs it
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Is it the right time in Ljubljana?
        id: gate
        run: |
          # The bot's last data commit: a later run of the same night has nothing left to do (one deploy a night).
          export LAST_DATA_COMMIT=$(git log -1 --author='^ff-bot ' --grep='^data:' --format=%ct origin/main)
          node scripts/ff-gate.ts
      - name: Merge club edits (branch vsebina)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.window != 'saturday'
        run: |
          git config user.name "ff-bot"
          git config user.email "ff-bot@users.noreply.github.com"
          if git fetch origin vsebina; then
            git merge --no-edit origin/vsebina || {
              git merge --abort
              echo "::warning::Branch vsebina could not be merged (conflict). The edits wait; results go out without them."
            }
          fi
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npm run fetch:ff
        if: steps.gate.outputs.run == 'true'
      - name: Weekly summary (Sunday run only)
        if: steps.gate.outputs.window == 'sunday'
        run: npm run week:publish
      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "ff-bot"
          git config user.email "ff-bot@users.noreply.github.com"
          git add src/data/ff src/content/novice
          git diff --cached --quiet || git commit -m "data: update FloorballFlash (and the weekly summary on Sunday)"
          # One push for the merged edits and the data: one deploy. Nothing new: no push, no deploy.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then git push origin HEAD:main; fi
      - name: Bring branch vsebina up to date
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.window != 'saturday'
        run: |
          # Fast-forward only: if an editor saved during the run, or the merge was skipped, vsebina stays and catches up
          # next time. Netlify does not build this branch.
          git push origin HEAD:vsebina || echo "::warning::Branch vsebina not updated; it catches up on the next run."
      # Last, so it never holds back the data: a FloorballFlash competition with an FBK Loka team that src/config/ff.ts
      # does not have yet (e.g. the youth leagues when they start) fails this step, and GitHub e-mails the owner about
      # the failed run. It keeps failing every Sunday until the competition is added (SPEC.md §5.7).
      - name: New FloorballFlash competitions?
        if: steps.gate.outputs.window == 'sunday'
        run: node scripts/scan-fbk-loka.ts --check
